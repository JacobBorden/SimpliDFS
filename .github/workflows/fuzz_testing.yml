name: Fuzz Testing

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsodium-dev libzstd-dev libfuse3-dev libboost-system1.83-dev pkg-config clang llvm \
                               libprotobuf-dev protobuf-compiler libgrpc-dev \
                               protobuf-compiler-grpc libgrpc++-dev libyaml-cpp-dev \
                               libc-ares-dev libcares2

    - name: Ensure libcares.a exists
      run: |
        LIBDIR=$(pkg-config --variable=libdir libcares)
        if [ -f "$LIBDIR/libcares_static.a" ] && [ ! -e "$LIBDIR/libcares.a" ]; then
          sudo ln -s libcares_static.a "$LIBDIR/libcares.a"
        fi

    - name: Configure CMake for Fuzzing
      run: |
        # Select the Ubuntu package with a matching static Boost.System archive.
        boost_dir=/usr/lib/x86_64-linux-gnu/cmake/Boost-1.83.0
        test -f "$boost_dir/BoostConfig.cmake"
        cmake -B build -S . -DBUILD_FUZZING=ON -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
          -DBoost_DIR="$boost_dir"

    - name: Build Fuzzers
      run: |
        cmake --build build

    - name: Run Fuzzers
      shell: bash
      run: |
        shopt -s nullglob
        fuzzers=(build/tests/*_fuzzer)
        if (( ${#fuzzers[@]} == 0 )); then
          echo "No fuzz targets found in build/tests" >&2
          exit 1
        fi

        mkdir -p fuzz_artifacts
        failed=0
        for fuzzer in "${fuzzers[@]}"; do
          fuzzer_name=${fuzzer##*/}
          if [[ ! -f "$fuzzer" || ! -x "$fuzzer" ]]; then
            echo "Fuzz target is not an executable file: $fuzzer" >&2
            failed=1
            continue
          fi
          echo "Running fuzzer: $fuzzer_name"
          corpus="./fuzz_artifacts/corpus_${fuzzer_name}/"
          mkdir -p "$corpus"
          # Keep a hard timeout in case libFuzzer exceeds its time limit.
          if timeout 60s "$fuzzer" -max_total_time=50 -rss_limit_mb=2048 -artifact_prefix=./fuzz_artifacts/ "$corpus" -seed=1; then
            echo "Fuzzer passed: $fuzzer_name"
          else
            status=$?
            echo "Fuzzer failed: $fuzzer_name (exit $status)" >&2
            failed=1
          fi
        done
        exit "$failed"

    - name: Upload Fuzzing Artifacts
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-artifacts
        path: |
          fuzz_artifacts/
          build/tests/crash-*
          build/tests/leak-*
          build/tests/timeout-*
        if-no-files-found: ignore # Don't fail if no crashes were found
